name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[mcp,dev]

    - name: Bytecode compilation check
      run: |
        python -m compileall -q local_coding_agent tests

    - name: Run unit and integration tests
      run: |
        python -m pytest -q

    - name: Run CLI Doctor Check
      run: |
        python -m local_coding_agent doctor

    - name: Run CLI Smoke Mock Test
      run: |
        python -m local_coding_agent test-run --mock

  windows-desktop-tauri:
    name: Windows Desktop/Tauri NSIS gate
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
        cache: npm

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable at refs/heads/stable

    - name: Install Python and frontend dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[mcp,dev]" pyinstaller
        npm ci

    - name: Run desktop release regressions
      run: python -m pytest -q tests/test_desktop_http_framing.py tests/test_desktop_release_gate.py tests/test_version_consistency.py

    - name: Build the Windows NSIS installer
      run: npm run tauri -- build --bundles nsis

    - name: Verify installer artifact
      id: installer
      shell: pwsh
      run: |
        $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
        if (-not $version) { throw "Could not read the project version" }
        $expected = "Local AI Coding Harness_${version}_x64-setup.exe"
        $installers = @(Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" -File)
        if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
        if ($installers[0].Name -ne $expected) { throw "Expected $expected, found $($installers[0].Name)" }
        if ($installers[0].Length -lt 1024) { throw "Installer is unexpectedly small" }
        "path=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT

    - name: Upload Windows installer
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: windows-nsis-installer
        path: ${{ steps.installer.outputs.path }}
        if-no-files-found: error
