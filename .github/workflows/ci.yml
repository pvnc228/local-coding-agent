name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[mcp,dev]

    - name: Bytecode compilation check
      run: |
        python -m compileall -q local_coding_agent tests

    - name: Run unit and integration tests
      run: |
        python -m pytest -q

    - name: Run CLI Doctor Check
      run: |
        python -m local_coding_agent doctor

    - name: Run CLI Smoke Mock Test
      run: |
        python -m local_coding_agent test-run --mock
