name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[mcp,dev]

    - name: Run unit and integration tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run CLI Doctor & Smoke Verification
      run: |
        python -m local_coding_agent doctor
        python -m local_coding_agent test-run --mock

  build-and-release:
    name: Build Distribution & Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build sdist and wheel
      run: |
        python -m build

    - name: Verify package distributions
      run: |
        twine check dist/*

    - name: Determine Release Tag
      id: release_info
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag_name }}"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Extract changelog section for release notes
      run: |
        TAG="${{ steps.release_info.outputs.tag }}"
        VERSION="${TAG#v}"
        python .github/scripts/extract_release_notes.py "$VERSION" "RELEASE_NOTES.md"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: Release ${{ steps.release_info.outputs.tag }}
        files: dist/*
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
