[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coding-agent"
version = "1.2.0"

description = "Harness-agnostic controller delegating atomic coding tasks to local Ollama & llama.cpp models via MCP, Agent Skills, and direct CLI."

readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Local Coding Agent Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp==2.0.0"]

[project.urls]
Homepage = "https://github.com/pvnc228/local-coding-agent"
Changelog = "https://github.com/pvnc228/local-coding-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/pvnc228/local-coding-agent/issues"

[project.scripts]
local-agent = "local_coding_agent.cli:main"
local-coding-agent = "local_coding_agent.cli:main"

[project.optional-dependencies]
# Kept so existing `local-coding-agent[mcp]` installs keep resolving; the SDK is a core dependency.
mcp = ["mcp==2.0.0"]
dev = ["pytest"]
desktop = ["pywebview>=5.0.0"]

[tool.setuptools.packages.find]
include = ["local_coding_agent*"]

[tool.setuptools.package-data]
local_coding_agent = ["desktop/assets/*.css", "desktop/assets/*.js", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
