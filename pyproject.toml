[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coding-agent"
version = "0.8.3"

description = "Harness-agnostic controller delegating atomic coding tasks to local Ollama & llama.cpp models via MCP, Agent Skills, and direct CLI."

readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Local Coding Agent Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
local-agent = "local_coding_agent.cli:main"
local-coding-agent = "local_coding_agent.cli:main"

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
dev = ["pytest"]
desktop = ["pywebview>=5.0.0"]
desktop-build = ["pyinstaller>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["local_coding_agent*"]

[tool.setuptools.package-data]
"local_coding_agent.desktop" = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
