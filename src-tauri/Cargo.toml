[package]
name = "local-coding-agent-desktop"
version = "0.8.2"
description = "Installable desktop shell for the Local AI Coding Harness"
edition = "2021"

[lib]
name = "local_coding_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "local-coding-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
